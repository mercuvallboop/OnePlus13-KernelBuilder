name: KSUN 3.4 SUSFS compatibility probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ksun34-susfs-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Probe KSUN v3.4.0 against current android15-6.6 SUSFS
        shell: bash
        run: |
          set -euo pipefail

          KSUN_COMMIT=1a879d6a866f80b1fa1c1009a2ffa747873cbb5e
          mkdir -p work diagnostics

          git init work/KernelSU-Next
          git -C work/KernelSU-Next remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C work/KernelSU-Next fetch --depth=1 origin "$KSUN_COMMIT"
          git -C work/KernelSU-Next checkout --detach FETCH_HEAD

          git clone --depth=1 --branch gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git work/susfs4ksu
          SUSFS_COMMIT="$(git -C work/susfs4ksu rev-parse HEAD)"
          SUSFS_VERSION="$(grep '#define SUSFS_VERSION' work/susfs4ksu/kernel_patches/include/linux/susfs.h | awk -F'"' '{print $2}')"

          printf '%s\n'             "ksun=$KSUN_COMMIT"             "susfs=$SUSFS_COMMIT"             "susfs_version=$SUSFS_VERSION"             > diagnostics/pins.txt

          cd work/KernelSU-Next
          set +e
          patch -p1 --forward < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch             > ../../diagnostics/base-patch.log 2>&1
          st=$?
          set -e
          echo "patch_exit=$st" >> ../../diagnostics/pins.txt
          cat ../../diagnostics/base-patch.log

          find kernel -name '*.rej' -type f | sort > ../../diagnostics/reject-list.txt
          git diff -- kernel > ../../diagnostics/ksun-after-current-susfs.patch || true

          while IFS= read -r rej; do
            [ -n "$rej" ] || continue
            {
              echo "===== reject: $rej ====="
              cat "$rej"
              echo
              echo "===== current source: ${rej%.rej} ====="
              cat "${rej%.rej}"
            } > "../../diagnostics/$(echo "$rej" | tr '/' '_').txt"
          done < ../../diagnostics/reject-list.txt

          echo "=== current SUSFS pin ==="
          cat ../../diagnostics/pins.txt
          echo "=== unresolved rejects ==="
          cat ../../diagnostics/reject-list.txt

          if [ "$st" -ne 0 ] || [ -s ../../diagnostics/reject-list.txt ]; then
            exit 2
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksun34-current-susfs-compat-diagnostics
          path: diagnostics/
          if-no-files-found: error
